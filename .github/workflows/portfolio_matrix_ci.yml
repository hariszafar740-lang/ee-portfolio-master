name: Master Portfolio Integration Test Sweep

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly every Sunday at midnight

jobs:
  test-matrix:
    name: Test Engineering Solvers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        repo:
          - power-systems-newton-raphson-solver
          - solar-pv-mppt-dynamic-solver
          - bess-soc-dynamics-solver
          - inverter-grid-control-solver

    steps:
    - name: Checkout Master Repository
      uses: actions/checkout@v4

    # The solver projects are separate, independent repositories (no git
    # submodules or vendored copies exist in this repo), so they must be
    # explicitly checked out into a matching subdirectory before any
    # "cd ${{ matrix.repo }}" step can work. Without this step the job
    # fails immediately with "No such file or directory" for every matrix
    # entry (confirmed via repeated CI failures on this workflow).
    - name: Checkout Solver Repository (${{ matrix.repo }})
      uses: actions/checkout@v4
      with:
        repository: hariszafar740-lang/${{ matrix.repo }}
        path: ${{ matrix.repo }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Sub-Repository Dependencies & Execute Pytest
      run: |
        cd ${{ matrix.repo }}
        python -m pip install --upgrade pip
        pip install "setuptools>=77.0" wheel build pytest ruff
        if [ -f pyproject.toml ]; then
          pip install --no-build-isolation -e .
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        PYTHONPATH=. pytest tests/
