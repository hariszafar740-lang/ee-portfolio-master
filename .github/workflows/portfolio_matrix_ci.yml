name: Master Portfolio Integration Test Sweep

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly every Sunday at midnight

jobs:
  test-matrix:
    name: Test Engineering Solvers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        repo:
          - power-systems-newton-raphson-solver
          - solar-pv-mppt-dynamic-solver
          - bess-soc-dynamics-solver
          - inverter-grid-control-solver

    steps:
    - name: Checkout Master Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Sub-Repository Dependencies & Execute Pytest
      run: |
        cd ${{ matrix.repo }}
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest
        PYTHONPATH=. pytest tests/
